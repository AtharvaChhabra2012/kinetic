<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign In — Business Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#f0f0f0;--muted:#555;--muted2:#888;--accent:#6366f1;--green:#22c55e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:340px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:40px}
.logo-mark{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.logo-name{font-size:14px;font-weight:600;letter-spacing:-0.3px}
h1{font-size:22px;font-weight:600;letter-spacing:-0.5px;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted2);margin-bottom:28px;line-height:1.5}
.tabs{display:flex;border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:24px;background:var(--surface)}
.tab{flex:1;padding:8px;border:none;background:none;color:var(--muted2);font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.tab.active{background:var(--border);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--muted2);margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase}
input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.15s;-webkit-appearance:none;font-family:inherit}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent)}
.name-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.25s,opacity 0.25s,margin 0.25s;margin-bottom:0}
.name-wrap.open{max-height:80px;opacity:1;margin-bottom:14px}
.btn-main{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s,transform 0.1s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:4px}
.btn-main:hover{opacity:0.88}
.btn-main:active{transform:scale(0.99)}
.btn-main:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.msg{border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.msg.ok{background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.2);color:#4ade80}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.setup{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;color:var(--muted2);line-height:1.8}
.setup strong{color:var(--muted2)}
.setup a{color:var(--accent);text-decoration:none}
.setup code{background:var(--border);padding:1px 5px;border-radius:4px;font-size:11px;color:#a5b4fc;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">📊</div>
    <span class="logo-name">Business Tracker</span>
  </div>
  <h1 id="hdg">Welcome back</h1>
  <p class="sub" id="sub">Sign in to access your dashboard.</p>
  <div class="tabs">
    <button class="tab active" id="tabIn">Sign In</button>
    <button class="tab" id="tabUp">Sign Up</button>
  </div>
  <div class="msg err" id="errMsg"></div>
  <div class="msg ok"  id="okMsg"></div>
  <div class="name-wrap" id="nameWrap">
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="iName" placeholder="Jane Smith" autocomplete="name">
    </div>
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="iEmail" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="iPwd" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-main" id="btnGo">Sign In</button>
  <div class="setup" id="setupBox">
    <strong>Setup required</strong> — open <code>login.html</code> and replace <code>YOUR_SUPABASE_URL</code>
    and <code>YOUR_SUPABASE_ANON_KEY</code> with your free <a href="https://supabase.com" target="_blank">Supabase</a> keys.<br>
    Also create table <code>bt_data</code> with columns <code>user_id</code> (text PK) and <code>payload</code> (jsonb).
  </div>
</div>
<script>
const SUPABASE_URL      = 'https://mgnbxkbvpfrwinfvmorc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PHr3_x2qmxPOFnGI9vyUPw_lWFrL_kk';
const configured = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
let sb = null;
if (configured) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.getElementById('setupBox').style.display = 'none';
}
let mode = 'in';
const tabIn    = document.getElementById('tabIn');
const tabUp    = document.getElementById('tabUp');
const hdg      = document.getElementById('hdg');
const sub      = document.getElementById('sub');
const btnGo    = document.getElementById('btnGo');
const nameWrap = document.getElementById('nameWrap');
const errMsg   = document.getElementById('errMsg');
const okMsg    = document.getElementById('okMsg');

tabIn.addEventListener('click', () => setMode('in'));
tabUp.addEventListener('click', () => setMode('up'));

function setMode(m) {
  mode = m;
  tabIn.classList.toggle('active', m === 'in');
  tabUp.classList.toggle('active', m === 'up');
  nameWrap.classList.toggle('open', m === 'up');
  hdg.textContent  = m === 'in' ? 'Welcome back' : 'Create account';
  sub.textContent  = m === 'in' ? 'Sign in to access your dashboard.' : 'Set up your Business Tracker account.';
  btnGo.textContent = m === 'in' ? 'Sign In' : 'Create Account';
  document.getElementById('iPwd').autocomplete = m === 'in' ? 'current-password' : 'new-password';
  clear();
}
function showErr(t) { errMsg.textContent = t; errMsg.classList.add('show'); okMsg.classList.remove('show'); }
function showOk(t)  { okMsg.textContent  = t; okMsg.classList.add('show');  errMsg.classList.remove('show'); }
function clear()    { errMsg.classList.remove('show'); okMsg.classList.remove('show'); }
function setLoad(on) {
  btnGo.disabled = on;
  btnGo.innerHTML = on
    ? '<div class="spin"></div>' + (mode === 'in' ? 'Signing in\u2026' : 'Creating account\u2026')
    : (mode === 'in' ? 'Sign In' : 'Create Account');
}
function storeUser(u, name) {
  const n = name || u.user_metadata?.name || u.email.split('@')[0];
  sessionStorage.setItem('bt_user', JSON.stringify({ id: u.id, email: u.email, name: n }));
}
async function go() {
  if (!configured) { showErr('Configure Supabase credentials first.'); return; }
  const email = document.getElementById('iEmail').value.trim();
  const pwd   = document.getElementById('iPwd').value;
  const name  = document.getElementById('iName').value.trim();
  if (!email || !pwd) { showErr('Please fill in all fields.'); return; }
  if (pwd.length < 6) { showErr('Password must be at least 6 characters.'); return; }
  if (mode === 'up' && !name) { showErr('Please enter your name.'); return; }
  setLoad(true); clear();
  try {
    if (mode === 'in') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
      if (error) throw error;
      storeUser(data.user);
      showOk('\u2713 Signed in! Loading\u2026');
      setTimeout(() => location.href = 'https://atharvachhabra2012.github.io/kinetic/index.html', 600);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pwd, options: { data: { name } } });
      if (error) throw error;
      if (data.user && !data.session) {
        showOk('\u2709\uFE0F Check your email to confirm your account, then sign in.');
      } else {
        storeUser(data.user, name);
        showOk('\u2713 Account created! Loading\u2026');
        setTimeout(() => location.href = 'https://atharvachhabra2012.github.io/kinetic/index.html', 600);
      }
    }
  } catch(e) { showErr(e.message || 'Something went wrong.'); }
  finally { setLoad(false); }
}
btnGo.addEventListener('click', go);
document.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
if (configured) {
  sb.auth.getSession().then(({ data }) => {
    if (data.session) { storeUser(data.session.user); location.href = 'https://atharvachhabra2012.github.io/kinetic/index.html'; }
  });
}
</script>
</body>
</html>
