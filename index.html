    <script>
        const SUPABASE_URL = 'https://mgnbxkbvpfrwinfvmorc.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_PHr3_x2qmxPOFnGI9vyUPw_lWFrL_kk';

        let _currentUser = null;
        let _supabase = null;

        (function() {
            const isConfigured = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
            const stored = sessionStorage.getItem('bt_user');

            if (!stored && isConfigured) {
                window.location.href = 'login.html';
                return;
            }
            if (stored) {
                _currentUser = JSON.parse(stored);
                if (isConfigured) {
                    try {
                        if (window.supabase && typeof window.supabase.createClient === 'function') {
                            const baseUrl = SUPABASE_URL.replace(/\/rest\/.*$/i, '');
                            _supabase = window.supabase.createClient(baseUrl, SUPABASE_ANON_KEY);
                            _supabase.auth.getSession().then(({ data }) => {
                                if (!data.session) {
                                    sessionStorage.removeItem('bt_user');
                                    window.location.href = 'login.html';
                                }
                            });
                        } else {
                            console.warn('Supabase library not available in main.html');
                        }
                    } catch (e) {
                        console.warn('Error creating Supabase client in main.html', e);
                    }
                }
            }
        })();

        function getStorageKey(key) {
            const uid = _currentUser ? _currentUser.id : 'local';
            return `bt_${uid}_${key}`;
        }

        async function logout() {
            // Clean up realtime subscription and polling before signing out
            try { if (typeof dataManager !== 'undefined') dataManager.destroy(); } catch(e) {}
            try {
                if (_supabase && _supabase.auth && typeof _supabase.auth.signOut === 'function') {
                    await _supabase.auth.signOut();
                }
            } catch (e) {
                console.warn('Error during supabase signOut:', e);
            }

            // Also remove potential Supabase auth tokens stored in localStorage to avoid automatic re-login
            try {
                Object.keys(localStorage).forEach(k => {
                    if (!k) return;
                    const key = k.toLowerCase();
                    if (key.includes('supabase') || key.includes('sb-') || key.includes('session') || key.includes('auth')) {
                        localStorage.removeItem(k);
                    }
                });
            } catch (e) { console.warn('Error clearing localStorage keys:', e); }

            sessionStorage.removeItem('bt_user');
            window.location.href = 'login.html';
        }

        function openAIOverview() {
            const aiOverviewPopup = document.getElementById('aiOverviewPopup');
            const plusBtn = document.querySelector('.plus-btn');
            const plusMenu = document.querySelector('.plus-menu');
            
            aiOverviewPopup.classList.add('active');
            plusBtn.classList.remove('open');
            plusMenu.classList.remove('active');
            
            // Load AI overview data
            loadAIOverview();
        }

        function closeAIOverview() {
            const aiOverviewPopup = document.getElementById('aiOverviewPopup');
            aiOverviewPopup.classList.remove('active');
        }

        function loadAIOverview() {
            // This will fetch and display AI-generated insights
            const overviewContent = document.getElementById('aiOverviewContent');
            overviewContent.innerHTML = '<div class="ai-loading"><i class="fas fa-spinner fa-spin"></i> Generating insights...</div>';
            
            // Simulate AI processing - replace with actual API call
            setTimeout(() => {
                const insights = generateBusinessInsights();
                displayAIInsights(insights);
            }, 1500);
        }

        function generateBusinessInsights() {
            // Placeholder for AI-generated insights
            return {
                summary: "Your business is performing well with steady revenue growth.",
                topMetrics: [
                    { label: "Total Revenue", value: "$12,450", trend: "+12%" },
                    { label: "Pending Invoices", value: "$3,200", trend: "-8%" },
                    { label: "Total Expenses", value: "$4,800", trend: "+5%" }
                ],
                recommendations: [
                    "Consider following up on 2 overdue invoices totaling $1,500",
                    "Expense trend increased by 5% - review recent spending",
                    "Plan budget allocation for next quarter"
                ],
                forecast: "Based on current trends, expect 15% revenue growth next month"
            };
        }

        function displayAIInsights(insights) {
            const overviewContent = document.getElementById('aiOverviewContent');
            
            let html = `
                <div class="ai-overview-section">
                    <h3 class="ai-section-title">Executive Summary</h3>
                    <p class="ai-summary-text">${insights.summary}</p>
                </div>
                
                <div class="ai-overview-section">
                    <h3 class="ai-section-title">Key Metrics</h3>
                    <div class="ai-metrics-grid">
            `;
            
            insights.topMetrics.forEach(metric => {
                const trendColor = metric.trend.startsWith('+') ? '#4ade80' : '#f43f5e';
                html += `
                    <div class="ai-metric-card">
                        <p class="ai-metric-label">${metric.label}</p>
                        <p class="ai-metric-value">${metric.value}</p>
                        <p class="ai-metric-trend" style="color: ${trendColor};">${metric.trend}</p>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
                
                <div class="ai-overview-section">
                    <h3 class="ai-section-title">Recommendations</h3>
                    <ul class="ai-recommendations-list">
            `;
            
            insights.recommendations.forEach(rec => {
                html += `<li class="ai-recommendation-item"><i class="fas fa-lightbulb"></i> ${rec}</li>`;
            });
            
            html += `
                    </ul>
                </div>
                
                <div class="ai-overview-section">
                    <h3 class="ai-section-title">Forecast</h3>
                    <div class="ai-forecast-box">
                        <i class="fas fa-chart-line"></i>
                        <p>${insights.forecast}</p>
                    </div>
                </div>
            `;
            
            overviewContent.innerHTML = html;
        }
    </script>

        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

</head>
<body>
    <div class="content-area" id="mainContent">
        <div class="card-grid">
            <div class="carde">
                <h3>Revenue</h3>
                <p>This month</p>
                <h2>$12,450</h2>
            </div>
            <div class="carde">
                <h3>Expenses</h3>
                <p>This month</p>
                <h2>$4,800</h2>
            </div>
            <div class="carde">
                <h3>Pending</h3>
                <p>Invoices due</p>
                <h2>$3,200</h2>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-btn">
            <i class="fas fa-file-invoice-dollar"></i>
            <span>Invoices</span>
        </button>
        <button class="plus-btn" id="plusBtn">
            <i class="fas fa-plus"></i>
        </button>
        <button class="nav-btn">
            <i class="fas fa-receipt"></i>
            <span>Expenses</span>
        </button>
        <button class="nav-btn">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </button>
    </div>

    <div class="plus-menu" id="plusMenu">
        <button class="plus-menu-item" onclick="openAIOverview()">
            <i class="fas fa-sparkles"></i>
            <span>AI Overview</span>
        </button>
        <button class="plus-menu-item">
            <i class="fas fa-file-circle-plus"></i>
            <span>New Invoice</span>
        </button>
        <button class="plus-menu-item">
            <i class="fas fa-receipt"></i>
            <span>New Expense</span>
        </button>
        <button class="plus-menu-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </button>
    </div>

    <!-- AI Overview Popup -->
    <div class="ai-overview-popup" id="aiOverviewPopup">
        <div class="ai-overview-backdrop" onclick="closeAIOverview()"></div>
        <div class="ai-overview-panel">
            <div class="ai-overview-header">
                <h2 class="ai-overview-title">
                    <i class="fas fa-sparkles"></i>
                    AI Overview
                </h2>
                <button class="ai-close-btn" onclick="closeAIOverview()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="aiOverviewContent">
                <div class="ai-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Loading insights...
                </div>
            </div>
        </div>
    </div>

    <script>
        const plusBtn = document.querySelector('.plus-btn');
        const plusMenu = document.querySelector('.plus-menu');

        plusBtn.addEventListener('click', () => {
            plusBtn.classList.toggle('open');
            plusMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.plus-btn') && !e.target.closest('.plus-menu')) {
                plusBtn.classList.remove('open');
                plusMenu.classList.remove('active');
            }
        });
    </script>
</body>
